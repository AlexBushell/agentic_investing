[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "company-intelligence-platform"
version = "0.1.0"
description = "Local-first company intelligence platform and IVF pre-screen runner."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "httpx>=0.28",
  "playwright>=1.52",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.9",
  "PyYAML>=6.0",
  "python-dotenv>=1.1",
  "PyMuPDF>=1.26",
  "sqlalchemy>=2.0",
  "tenacity>=9.1",
  "typer>=0.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "ruff>=0.11",
]

[project.scripts]
research = "research_platform.cli:app"
research-platform = "research_platform.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
